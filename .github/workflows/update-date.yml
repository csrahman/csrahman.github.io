name: Update Last Updated Date

on:
  push:
    branches: [main]

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get last commit date
        id: commit_date
        run: |
          DATE=$(git log -1 --format=%cd --date=format:'%B %d, %Y')
          echo "LAST_UPDATED=$DATE" >> $GITHUB_ENV

      - name: Replace placeholder in HTML
        run: |
          sed -i "s/{{LAST_UPDATED}}/${LAST_UPDATED}/g" index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update last updated date" || echo "No changes to commit"
          git push
