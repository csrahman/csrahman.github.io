name: Update Last Updated and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Step 1: Checkout repository with PAT
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

# Step 2: Get last commit date
      - name: Get last commit date
        run: |
          DATE=$(git log -1 --format=%cd --date=iso)
          echo "LAST_UPDATED=$DATE" >> $GITHUB_ENV

      # Step 3: Replace placeholder in HTML
      - name: Replace placeholder in HTML
        run: |
          TODAY=$(date +%s)
          LAST=$(date -d "${LAST_UPDATED}" +%s)
          DIFF_DAYS=$(( (TODAY - LAST) / 86400 ))
          TEXT="${DIFF_DAYS} day$([ "$DIFF_DAYS" -eq 1 ] || echo "s") ago"
          sed -i "s|{{LAST_UPDATED}}|$TEXT|g" index.html

      # Debug check
      - name: Show updated HTML
        run: grep "Last Updated" index.html || cat index.html

      # Step 4: Commit changes (optional, no push)
      - name: Commit changes locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update last updated date" || echo "No changes to commit"

      # Step 5: Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Step 6: Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Step 7: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
